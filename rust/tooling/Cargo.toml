[package]
name = "devcoordinator2-tooling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "devcoordinator2_tooling"

[[bin]]
name = "devcoordinator2-tooling"
path = "src/main.rs"

[[bin]]
name = "devcoordinator2-selftest-coordinator"
path = "src/bin/selftest_coordinator.rs"
required-features = ["selftest-fixtures"]
test = false
bench = false

[[bin]]
name = "devcoordinator2-selftest-leaf"
path = "src/bin/selftest_leaf.rs"
required-features = ["selftest-fixtures"]
test = false
bench = false

[features]
selftest-fixtures = []

[dependencies]
base64.workspace = true
clap.workspace = true
devcoordinator2-api = { path = "../api" }
devcoordinator2-executor-protocol = { path = "../executor-protocol" }
getrandom.workspace = true
globset.workspace = true
ignore.workspace = true
libc.workspace = true
quick-xml.workspace = true
regex.workspace = true
rusqlite.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tree-sitter.workspace = true
tree-sitter-python.workspace = true
unicode-normalization.workspace = true
tempfile = "=3.23.0"

[dev-dependencies]
