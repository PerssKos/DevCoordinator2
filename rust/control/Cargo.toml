[package]
name = "devcoordinator2-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "devcoordinator2_control"

[[bin]]
name = "devcoordinator2"
path = "src/main.rs"

[[bin]]
name = "devcoordinator2-root-acceptance"
path = "src/bin/root_acceptance.rs"
required-features = ["root-acceptance"]
test = false
bench = false

[features]
root-acceptance = []
glossary-fixture = []

[[example]]
name = "glossary_console_fixture"
required-features = ["glossary-fixture"]

[dependencies]
base64.workspace = true
clap.workspace = true
devcoordinator2-api = { path = "../api" }
devcoordinator2-executor-core = { path = "../executor-core" }
devcoordinator2-executor-protocol = { path = "../executor-protocol" }
getrandom.workspace = true
libc.workspace = true
regex.workspace = true
reqwest.workspace = true
rmcp.workspace = true
rusqlite.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile = "=3.23.0"
time.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
