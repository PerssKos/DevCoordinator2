<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevCoordinator2</title>
<script src="/theme.js?v=shared-theme-20260905"></script>
<link rel="stylesheet" href="/app.css?v=shared-theme-20260905">
<link rel="stylesheet" href="/design-system.css?v=shared-theme-20260905">
<link rel="stylesheet" href="/glossary.css?v=glossary-20260905">
<link rel="stylesheet" href="/artifacts.css?v=readable-evidence-20260906">
<link rel="stylesheet" href="/tests.css?v=shared-workspace-20260907">
<link rel="stylesheet" href="/workspace.css?v=shared-workspace-20260907">
</head>
<body>
<header class="top">
  <a class="brand" href="#/plan">DevCoordinator2</a>
  <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Open navigation" aria-controls="nav" aria-expanded="false"><span class="ti ti-menu-2" aria-hidden="true"></span></button>
  <nav id="nav" aria-label="Primary">
    <a href="#/plan" data-view="plan">Repositories</a>
    <a href="#/health" data-view="health">Health</a>
    <a href="#/bugs" data-view="bugs">Bugs</a>
    <a href="#/glossary/shared" data-view="glossary">Shared glossary</a>
    <a href="#/tests?settings=capacity" data-view="test-capacity" id="test-capacity-open">Test capacity</a>
    <a href="#/tests?settings=retention" data-view="test-retention" id="test-log-retention-open">Log retention</a>
    <a href="#/admin" data-view="admin" id="nav-admin" hidden>Administration</a>
  </nav>
  <div class="who"><button class="btn btn-small" id="theme-toggle" type="button">Appearance</button><span id="who-email" class="mono"></span> <a href="/auth/logout" class="btn btn-small">Sign out</a></div>
</header>
<div id="banner" class="banner" hidden></div>
<div id="repository-workspace" class="repository-workspace">
  <button type="button" id="repository-overlay" class="repository-overlay" aria-label="Close repository list" tabindex="-1" hidden></button>
  <aside id="repository-sidebar" class="repository-sidebar" aria-label="Repository selection" hidden>
    <div class="repository-sidebar-heading"><strong>Repositories</strong><button type="button" id="repository-refresh" class="workspace-icon" aria-label="Refresh repositories"><span class="ti ti-refresh" aria-hidden="true"></span></button><button type="button" id="repository-close" class="workspace-icon" aria-label="Close repository list"><span class="ti ti-x" aria-hidden="true"></span></button></div>
    <label class="repository-search"><input id="repository-search" type="search" aria-label="Find a repository" placeholder="Find a repository"></label>
    <nav id="repository-list" class="repository-list" aria-label="Repositories"></nav>
    <p id="repository-status" role="status"></p>
    <details id="workspace-checkouts" class="workspace-checkouts" hidden></details>
    <div id="repository-resize" class="repository-resize" role="separator" aria-label="Repository sidebar width" aria-orientation="vertical" aria-controls="repository-sidebar" aria-valuemin="240" aria-valuemax="480" aria-valuenow="280" tabindex="0"></div>
  </aside>
  <div class="workspace-content">
    <header id="workspace-context" class="workspace-context" hidden><div class="workspace-title"><button type="button" id="repository-toggle" class="workspace-icon" aria-label="Show repositories" aria-controls="repository-sidebar" aria-expanded="false"><span class="ti ti-menu-2" aria-hidden="true"></span></button><p id="workspace-heading"></p><button type="button" id="repository-presentation" class="workspace-icon" aria-label="Edit repository name and icon" title="Edit repository name and icon" hidden><span class="ti ti-pencil" aria-hidden="true"></span></button></div><p id="workspace-root" hidden></p><span id="workspace-record-scope" hidden></span><nav id="workspace-aspects" class="workspace-aspects" aria-label="Repository aspects"></nav></header>
    <nav id="workspace-work-views" class="workspace-work-views" aria-label="Plan and progress views" hidden></nav>
    <main id="main" class="main"><p class="muted">Loading…</p></main>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/glossary.js?v=glossary-20260905"></script>
<script src="/artifact-content.js?v=readable-evidence-20260906b"></script>
<script src="/artifacts.js?v=shared-workspace-20260907"></script>
<script src="/tests.js?v=shared-workspace-20260907"></script>
<script src="/workspace.js?v=shared-workspace-20260907"></script>
<script src="/app.js?v=shared-workspace-20260907"></script>
</body>
</html>
