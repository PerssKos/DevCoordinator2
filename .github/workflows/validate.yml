name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    name: Rust control plane
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets --features devcoordinator2-tooling/selftest-fixtures,devcoordinator2-control/root-acceptance -- -D warnings
      - name: Build release binaries
        run: cargo build --locked --release --package devcoordinator2-control --package devcoordinator2-tooling --package devcoordinator2-executor --features devcoordinator2-tooling/selftest-fixtures
      - name: Check committed file privacy, evidence, sizes, and executable modes
        run: target/release/devcoordinator2-tooling check pre-commit --root . --tree HEAD
      - name: Test Rust workspace
        run: cargo test --locked --workspace --no-fail-fast --features devcoordinator2-tooling/selftest-fixtures -- --test-threads=1
      - name: Build Linux root-acceptance fixtures
        run: cargo build --locked --release --package devcoordinator2-control --features root-acceptance --bin devcoordinator2 --bin devcoordinator2-root-acceptance --package devcoordinator2-executor-core --bin devcoordinator2-executor-test-fixture

  edge:
    name: Edge runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Run edge tests and syntax checks
        run: |
          node --test edge/test/*.test.mjs
          node --check console/app.js
          node --check console/verify.mjs

  six-skill-validation:
    name: Six canonical skills (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ci/playwright/package-lock.json

      - name: Install locked Playwright runtime
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix ci/playwright
          echo "NODE_PATH=$GITHUB_WORKSPACE/ci/playwright/node_modules" >> "$GITHUB_ENV"

      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: ci/playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Install Chromium on macOS
        if: runner.os == 'macOS'
        run: ci/playwright/node_modules/.bin/playwright install chromium

      - name: Build release Rust validation binaries
        run: cargo build --locked --release --package devcoordinator2-control --package devcoordinator2-tooling --package devcoordinator2-executor --features devcoordinator2-tooling/selftest-fixtures

      - name: Run complete repository validation
        run: target/release/devcoordinator2-tooling skills validate run --root "$GITHUB_WORKSPACE" --temp-root "$RUNNER_TEMP/devcoordinator2-skill-validation"

      - name: Collect bounded CI validation diagnostics
        if: always()
        run: |
          if [ -x target/release/devcoordinator2-tooling ]; then
            target/release/devcoordinator2-tooling skills validate evidence --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/devcoordinator2-ci-evidence"
          fi

      - name: Retain CI validation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-diagnostics-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/devcoordinator2-ci-evidence/*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Run rendered Console verification
        if: runner.os == 'Linux'
        run: node console/verify.mjs
